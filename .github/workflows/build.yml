name: Build FilzaApplySandboxExt dylib (iOS 26.3)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --depth 1 https://github.com/theos/theos.git $THEOS
        cd $THEOS && ./bin/update-theos 2>&1 | tail -3
    - name: Build
      run: |
        export THEOS=$HOME/theos
        export ADDITIONAL_CFLAGS="-IXPF/external/ChOma/include -IXPF/external/ChOma/src"
        make clean 2>/dev/null; make -j4 2>&1 | tail -20
        echo "=== Files ==="
        find . .theos -name "FilzaApplySandboxExt.dylib" 2>/dev/null
        mkdir -p output
        find . .theos -name "FilzaApplySandboxExt.dylib" -exec cp {} output/ \; 2>/dev/null
        ls -la output/
    - uses: actions/upload-artifact@v4
      with:
        name: FilzaApplySandboxExt-iOS26.3
        path: output/

# After Theos build, add padding for code signature
- name: Add code signature space
  run: |
    DYLIB=$(find .theos -name "FilzaApplySandboxExt.dylib" | head -1)
    if [ -n "$DYLIB" ]; then
      echo "Adding LC_CODE_SIGNATURE padding to $DYLIB"
      # Use install_name_tool to trigger reallocation with padding
      install_name_tool -add_rpath @executable_path/Frameworks "$DYLIB" 2>/dev/null || true
      install_name_tool -delete_rpath @executable_path/Frameworks "$DYLIB" 2>/dev/null || true
    fi
