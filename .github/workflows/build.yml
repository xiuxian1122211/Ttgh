name: Full Manual Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Theos (for headers only)
      run: |
        git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
        cd $HOME/theos && ./bin/update-theos 2>&1 | tail -3
    
    - name: Manual Compile
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK: $SDK"
        
        # Collect all .m and .c files for the dylib
        OBJCFILES="Tweak.m sandbox_escape.m apfs_own.m"
        KEXPLOIT="kexploit/kexploit_opa334.m kexploit/krw.m kexploit/kutils.m kexploit/offsets.m kexploit/vnode.m"
        UTILS="utils/file.c utils/hexdump.c utils/process.c"
        
        # Build obj files
        mkdir -p build/arm64 build/arm64e
        
        for ARCH in arm64 arm64e; do
          echo "=== Building $ARCH ==="
          FLAGS="-arch $ARCH -isysroot $SDK -miphoneos-version-min=15.0 -fobjc-arc"
          FLAGS="$FLAGS -I. -Ikexploit -Ikpf -Iutils -IXPF/src"
          FLAGS="$FLAGS -IFrameworks -Wno-everything -fmodules"
          
          echo "Compiling $f..."
          for f in $OBJCFILES $KEXPLOIT $UTILS; do
            out="build/$ARCH/$(basename $f .m).o"
            out="${out%.c}.o"
            xcrun --sdk iphoneos clang $FLAGS -c "$f" -o "$out" 2>&1 | grep -i error | head -3
          done
        done
        
        # Link into single dylib
        ARM64_OBJ=$(find build/arm64 -name "*.o")
        ARM64E_OBJ=$(find build/arm64e -name "*.o")
        
        echo "ARM64 objects: $(echo $ARM64_OBJ | wc -w)"
        echo "ARM64E objects: $(echo $ARM64E_OBJ | wc -w)"
        
        # Check if any .o files missing
        missing=0
        for f in $OBJCFILES $KEXPLOIT $UTILS; do
          name=$(basename $f .m)
          name="${name%.c}"
          if [ ! -f "build/arm64/${name}.o" ]; then
            echo "MISSING: build/arm64/${name}.o"
            missing=$((missing+1))
          fi
        done
        echo "Missing files: $missing"
    - name: Link dylib
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        LFLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=15.0"
        LFLAGS="$LFLAGS -dynamiclib -compatibility_version 1.0 -current_version 1.0"
        LFLAGS="$LFLAGS -install_name @executable_path/FilzaApplySandboxExt.dylib"
        LFLAGS="$LFLAGS -framework Foundation -framework CoreFoundation -framework UIKit -framework IOKit -framework IOSurface"
        LFLAGS="$LFLAGS -lz -lsandbox"
        LFLAGS="$LFLAGS -headerpad_max_install_names"
        
        ARM64_OBJ=$(find build/arm64 -name "*.o" | sort)
        xcrun --sdk iphoneos clang $LFLAGS $ARM64_OBJ -o build/FilzaApplySandboxExt_arm64.dylib 2>&1 | head -20
        
        LFLAGS_E="-arch arm64e -isysroot $SDK -miphoneos-version-min=15.0"
        LFLAGS_E="$LFLAGS_E -dynamiclib -compatibility_version 1.0"
        LFLAGS_E="$LFLAGS_E -install_name @executable_path/FilzaApplySandboxExt.dylib"
        LFLAGS_E="$LFLAGS_E -framework Foundation -framework CoreFoundation -framework UIKit -framework IOKit -framework IOSurface"
        LFLAGS_E="$LFLAGS_E -lz -lsandbox"
        LFLAGS_E="$LFLAGS_E -headerpad_max_install_names"
        
        ARM64E_OBJ=$(find build/arm64e -name "*.o" | sort)
        xcrun --sdk iphoneos clang $LFLAGS_E $ARM64E_OBJ -o build/FilzaApplySandboxExt_arm64e.dylib 2>&1 | head -20
        
        # Lipo into fat binary
        mkdir -p output
        lipo -create build/FilzaApplySandboxExt_arm64.dylib build/FilzaApplySandboxExt_arm64e.dylib -o output/FilzaApplySandboxExt.dylib
        ls -la output/
        file output/*.dylib
    - uses: actions/upload-artifact@v4
      with:
        name: FilzaApplySandboxExt
        path: output/
