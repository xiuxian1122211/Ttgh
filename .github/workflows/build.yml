name: Build FilzaApplySandboxExt
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Theos
      run: |
        git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
        cd $HOME/theos && ./bin/update-theos 2>&1 | tail -3
    - name: Build
      run: |
        export THEOS=$HOME/theos
        make clean 2>/dev/null; make -j4 2>&1 | tail -15
    - name: Post-process: fix code sign space
      run: |
        for DYLIB in $(find .theos -name "FilzaApplySandboxExt.dylib"); do
          echo "Processing: $DYLIB"
          # Add empty rpath then remove it to force LC_CODE_SIGNATURE reallocation
          install_name_tool -add_rpath /tmp "$DYLIB" 2>/dev/null
          install_name_tool -delete_rpath /tmp "$DYLIB" 2>/dev/null
          # Verify it has LC_CODE_SIGNATURE
          otool -l "$DYLIB" | grep -A1 LC_CODE_SIGNATURE
        done
        mkdir -p output
        find .theos -name "FilzaApplySandboxExt.dylib" -exec cp {} output/ \;
        ls -la output/
        file output/*.dylib
    - uses: actions/upload-artifact@v4
      with:
        name: FilzaApplySandboxExt
        path: output/
